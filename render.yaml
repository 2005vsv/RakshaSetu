services:
  # -----------------------------------------------------------
  # 1. RakshaSetu Backend API (Node.js + Express + Socket.IO)
  # -----------------------------------------------------------
  - type: web
    name: rakshasetu-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASS
        value: admin123
      - key: FRONTEND_ORIGIN
        value: "*"

  # -----------------------------------------------------------
  # 2. RakshaSetu Frontend (React Admin & Police Web Portal)
  # -----------------------------------------------------------
  - type: web
    name: rakshasetu-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: build
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_NODE_API_BASE_URL
        fromService:
          type: web
          name: rakshasetu-backend
          property: host


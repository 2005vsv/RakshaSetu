name: Build Standalone Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build-android:
    name: Build RakshaSetu APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📱 Setup Android SDK Environment
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Install Mobile Dependencies
        working-directory: mobile
        run: |
          npm install --legacy-peer-deps --force

      - name: 🔑 Configure Release Permissions & Keystore
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          if [ ! -f app/debug.keystore ]; then
            echo "Generating debug.keystore fallback..."
            keytool -genkey -v -keystore app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          ls -lh app/debug.keystore

      - name: 🚀 Build Standalone Release APK with Gradle
        working-directory: mobile/android
        run: |
          ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m" --stacktrace

      - name: 🏷️ Collect and Rename Standalone APK
        working-directory: mobile/android
        run: |
          mkdir -p build-out
          find app/build/outputs/apk -name "*release*.apk" -o -name "*unsigned*.apk" -o -name "*.apk" | head -n 1 | xargs -I {} cp {} build-out/RakshaSetu.apk
          ls -lh build-out/RakshaSetu.apk

      - name: 📤 Upload APK Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: RakshaSetu-APK
          path: mobile/android/build-out/RakshaSetu.apk
          if-no-files-found: error

      - name: 🌐 Publish Standalone APK Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.1
          name: "RakshaSetu Tourist Safety v1.0.1 Standalone Android APK"
          body: |
            ### 🛡️ RakshaSetu - Standalone Android Application (.apk)

            **Official Project Submission Build**

            #### ✨ Key Features in this Build:
            - **24/7 Cloud Connectivity:** Pre-configured with live Render cloud backend (`https://rakshasetu-backend-4775.onrender.com`).
            - **Real-Time Android Notifications:** Instant system alerts in the top notification tray for:
              - ⚠️ High-Risk and Restricted Zone creations.
              - 📢 Official safety announcements.
              - 🚓 Police dispatch confirmations & status updates.
              - 💬 Admin support ticket replies.
            - **One-Tap SOS & Offline Cellular Beacon:** Instant emergency alerting even without mobile data.
            - **Real-Time Tourist Safety Radar:** Safe havens, live routing avoiding danger zones, and digital tourist ID verification.

            #### 📲 Installation Instructions:
            1. Download `RakshaSetu.apk` directly onto your Android device.
            2. Tap the downloaded file to install.
            3. Grant Location and Notification permissions when prompted.
          files: mobile/android/build-out/RakshaSetu.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
